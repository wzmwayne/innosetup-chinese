name: Build with Docker

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/ghcr.io/delphi-community/delphi:12.2

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Build 64-bit
      run: |
        cd $GITHUB_WORKSPACE
        /opt/delphi/bin/dcc64 -B Projects\Src\Setup.dproj

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: inno-setup-binaries
        path: Files/
        retention-days: 30