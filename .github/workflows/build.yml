name: Build Inno Setup

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Setup Delphi
      uses: DelphiWorldWide/setup-delphi@v1.0
      with:
        delphi-version: community

    - name: Install GetIt dependencies
      run: |
        cd ${{ github.workspace }}
        .\getit.bat --no-gui

    - name: Build 64-bit
      run: |
        cd ${{ github.workspace }}
        .\compile.bat x64

    - name: Build 32-bit
      run: |
        cd ${{ github.workspace }}
        .\compile.bat x86

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: inno-setup-binaries
        path: |
          Files/*.exe
          Files/*.dll
          Files/*.e32
          Files/*.e64
        retention-days: 30