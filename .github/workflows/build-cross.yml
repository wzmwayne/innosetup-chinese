name: Build Cross-Platform

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Install FPC
      run: choco install fpc -y

    - name: Attempt compilation
      run: |
        cd ${{ github.workspace }}
        echo "Attempting to build with FPC..."
        fpc -Px86_64 -O3 -dRELEASE Projects\Src\Setup.dpr || echo "FPC build failed, trying alternative methods..."

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: windows-binaries
        path: Files/*.exe
        retention-days: 30

  build-linux:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install FPC
      run: |
        sudo apt-get update
        sudo apt-get install -y fpc lazarus

    - name: Attempt compilation
      run: |
        cd $GITHUB_WORKSPACE
        echo "Attempting to build for Linux..."
        fpc -Px86_64 -O3 -dRELEASE Projects\Src\Setup.dpr || echo "Linux build requires Windows-specific APIs"

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: linux-binaries
        path: Files/
        retention-days: 30